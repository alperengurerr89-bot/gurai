<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gürai - Yapay Zeka Asistanı</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Giriş Ekranı */
        #login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .card {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #4CAF50; margin-bottom: 10px; font-size: 24px; }
        p { color: #b0b0b0; margin-bottom: 30px; font-size: 14px; }
        #login-btn {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        #login-btn:hover { background-color: #357ae8; }

        /* Sohbet Ekranı */
        #app-container {
            display: none;
            height: 100vh;
            width: 100%;
            flex-direction: column;
            background: #121212;
        }
        header {
            background: #181818;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }
        header h2 { margin: 0; color: #4CAF50; font-size: 18px; }
        #user-profile { color: #81c784; font-size: 13px; }
        
        #chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.4;
            font-size: 14px;
        }
        .message.ai {
            background: #1e1e1e;
            align-self: flex-start;
            border-left: 4px solid #4CAF50;
        }
        .message.user {
            background: #2b5278;
            align-self: flex-end;
        }
        
        .chat-input-area {
            padding: 20px;
            background: #181818;
            display: flex;
            gap: 10px;
            border-top: 1px solid #2a2a2a;
        }
        #chat-input {
            flex: 1;
            padding: 12px;
            background: #222;
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
            font-size: 14px;
        }
        #chat-input:focus { outline: none; border-color: #4CAF50; }
        #send-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #send-btn:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-container">
        <div class="card">
            <h1>Gürai'ye Hoş Geldiniz</h1>
            <p>Devam etmek için lütfen Google hesabınızla giriş yapın.</p>
            <button id="login-btn" onclick="handleAuthClick()">Google ile Giriş Yap</button>
        </div>
    </div>

    <!-- SOHBET PANELİ -->
    <div id="app-container">
        <header>
            <h2>Gürai Yapay Zeka Asistanı</h2>
            <div id="user-profile">Yükleniyor...</div>
        </header>
        
        <div id="chat-messages">
            <div class="message ai">Merhaba! Ben Gürai, senin yapay zeka asistanınım. Sana bugün nasıl yardımcı olabilirim?</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Bir şeyler yazın..." onkeypress="checkEnter(event)">
            <button id="send-btn" onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        let client;
        let userName = "Kullanıcı";

        window.onload = function () {
            client = google.accounts.oauth2.initTokenClient({
                client_id: '508069214780-j2btpn15rhmn7mhcfui74bcfn8l187l.apps.googleusercontent.com',
                scope: 'https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',
                callback: (response) => {
                    if (response.access_token) {
                        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                            headers: { 'Authorization': `Bearer ${response.access_token}` }
                        })
                        .then(res => res.json())
                        .then(data => {
                            userName = data.name;
                            document.getElementById('login-container').style.display = 'none';
                            document.getElementById('app-container').style.display = 'flex';
                            document.getElementById('user-profile').innerText = `${data.name} (${data.email})`;
                        });
                    }
                },
            });
        };

        function handleAuthClick() {
            if (client) {
                client.requestAccessToken();
            } else {
                alert("Google servisleri yükleniyor, lütfen bekleyin.");
            }
        }

        function getAIAssistantResponse(userText) {
            const text = userText.toLowerCase();

            // Akıllı Yanıt Mantığı
            if (text.includes('merhaba') || text.includes('selam')) {
                return `Selam ${userName}! Sana nasıl yardımcı olabilirim?`;
            } else if (text.includes('nasıl') && (text.includes('iyisin') || text.includes('nasılın'))) {
                return "Ben bir yapay zeka asistanıyım, her zaman harikayım ve kod yazmaya hazırım! Sen nasılsın?";
            } else if (text.includes('sen kimsin') || text.includes('adın ne')) {
                return "Ben Gürai, senin kişisel yapay zeka asistanınım.";
            } else if (text.includes('kod') || text.includes('python') || text.includes('html')) {
                return "Yazılım ve kodlama konularında sana yardımcı olmaktan mutluluk duyarım. Ne geliştirmek istiyorsun?";
            } else {
                return `Harika bir nokta! "${userText}" konusunu Gürai altyapısıyla işliyorum. Bunu senin için geliştirmeye devam edeceğim.`;
            }
        }

        function sendMessage() {
            const inputField = document.getElementById('chat-input');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            const messagesDiv = document.getElementById('chat-messages');

            // Kullanıcı mesajını ekle
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = messageText;
            messagesDiv.appendChild(userMsg);

            inputField.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // Yapay zeka yanıtını simüle et (Yapay zeka düşünüyor efekti için küçük gecikme)
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.innerText = getAIAssistantResponse(messageText);
                messagesDiv.appendChild(aiMsg);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }, 600);
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
