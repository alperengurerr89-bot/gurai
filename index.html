<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gürai - Yapay Zeka Asistanı</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Giriş Ekranı */
        #login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            background: #121212;
            z-index: 10;
        }
        .card {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #4CAF50; margin-bottom: 10px; font-size: 24px; }
        p { color: #b0b0b0; margin-bottom: 30px; font-size: 14px; }
        #login-btn {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        #login-btn:hover { background-color: #357ae8; }

        /* Sohbet Paneli */
        #app-container {
            display: none;
            height: 100vh;
            width: 100vw;
            flex-direction: column;
            background: #121212;
        }
        header {
            background: #181818;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
        }
        header h2 { margin: 0; color: #4CAF50; font-size: 18px; }
        #user-profile { color: #81c784; font-size: 13px; font-weight: 500; }
        
        #chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }
        .message.ai {
            background: #1e1e1e;
            align-self: flex-start;
            border-left: 4px solid #4CAF50;
        }
        .message.user {
            background: #2b5278;
            align-self: flex-end;
        }
        
        .chat-input-area {
            padding: 20px;
            background: #181818;
            display: flex;
            gap: 10px;
            border-top: 1px solid #2a2a2a;
            flex-shrink: 0;
        }
        #chat-input {
            flex: 1;
            padding: 12px;
            background: #222;
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
            font-size: 14px;
        }
        #chat-input:focus { outline: none; border-color: #4CAF50; }
        #send-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #send-btn:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-container">
        <div class="card">
            <h1>Gürai'ye Hoş Geldiniz</h1>
            <p>Devam etmek için lütfen Google hesabınızla giriş yapın.</p>
            <button id="login-btn" onclick="handleAuthClick()">Google ile Giriş Yap</button>
        </div>
    </div>

    <!-- SOHBET PANELİ -->
    <div id="app-container">
        <header>
            <h2>Gürai Yapay Zeka Asistanı</h2>
            <div id="user-profile">Yükleniyor...</div>
        </header>
        
        <div id="chat-messages">
            <div class="message ai">Merhaba! Ben Gürai. Hiç kesintiye uğramadan seninle sohbet etmeye ve kod yazmaya hazırım. Bana ne sormak istersin?</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Bir şeyler yazın..." onkeypress="checkEnter(event)">
            <button id="send-btn" onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        let client;
        let userName = "Kullanıcı";

        window.onload = function () {
            client = google.accounts.oauth2.initTokenClient({
                client_id: '508069214780-quddo25hr57m3glseal3i45km6in5247.apps.googleusercontent.com',
                scope: 'https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',
                callback: (response) => {
                    if (response.access_token) {
                        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                            headers: { 'Authorization': `Bearer ${response.access_token}` }
                        })
                        .then(res => res.json())
                        .then(data => {
                            userName = data.name;
                            document.getElementById('login-container').style.display = 'none';
                            document.getElementById('app-container').style.display = 'flex';
                            document.getElementById('user-profile').innerText = `${data.name} (${data.email})`;
                        });
                    }
                },
            });
        };

        function handleAuthClick() {
            if (client) {
                client.requestAccessToken();
            } else {
                alert("Google servisleri yükleniyor, lütfen bekleyin.");
            }
        }

        function getBrainResponse(text) {
            const t = text.toLowerCase();

            if (t.includes('merhaba') || t.includes('selam') || t.includes('hey')) {
                return `Selamlar ${userName}! Sistemler sorunsuz çalışıyor, bugün neler kodluyoruz?`;
            } else if (t.includes('nasıl') && (t.includes('iyi') || t.includes('nasılın'))) {
                return "Arka plandaki motorlar tam gaz çalışıyor, gayet iyiyim! Sen nasılsın, projeler nasıl gidiyor?";
            } else if (t.includes('sen kimsin') || t.includes('ne yapabiliyorsun')) {
                return "Ben Gürai'yim. Kesintisiz çalışan, kodlama, mantık yürütme ve proje geliştirme süreçlerinde sana destek olan yapay zeka asistanınım.";
            } else if (t.includes('python') || t.includes('kod') || t.includes('html') || t.includes('js')) {
                return "Harika bir programlama konusu! İlgili kod bloklarını ve mantığını kurmanda seve seve yardımcı olurum. Detayları paylaşabilirsin.";
            } else if (t.includes('saat kaç') || t.includes('tarih')) {
                return `Şu anki sistem zamanı: ${new Date().toLocaleTimeString()} - Her şey kontrol altında!`;
            } else {
                return `Anladım ${userName}: "${text}" konusunu işleme aldım. Kesintisiz bir şekilde bu özellik üzerinde birlikte çalışabiliriz. Başka ne ekleyelim?`;
            }
        }

        function sendMessage() {
            const inputField = document.getElementById('chat-input');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            const messagesDiv = document.getElementById('chat-messages');

            // Kullanıcı mesajını ekle
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = messageText;
            messagesDiv.appendChild(userMsg);

            inputField.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // Yapay zeka yanıtı
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.innerText = getBrainResponse(messageText);
                messagesDiv.appendChild(aiMsg);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }, 400);
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
