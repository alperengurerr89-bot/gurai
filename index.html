<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gürai - Hesap Yönetimi ve Asistan</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Giriş Ekranı */
        #login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .card {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #4CAF50; margin-bottom: 10px; font-size: 24px; }
        p { color: #b0b0b0; margin-bottom: 30px; font-size: 14px; }
        #login-btn {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        #login-btn:hover { background-color: #357ae8; }

        /* Ana Panel / Hesap Yönetimi + Sohbet */
        #app-container {
            display: none;
            height: 100vh;
            width: 100%;
            display: flex;
        }
        /* Sol Yan Menü (Hesap Yönetimi) */
        sidebar {
            width: 280px;
            background: #181818;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: space-between;
        }
        .account-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #2a2a2a;
        }
        #user-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 2px solid #4CAF50;
            object-fit: cover;
        }
        #user-name { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        #user-email { font-size: 12px; color: #888; word-break: break-all; }
        
        .menu-links {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .menu-btn {
            background: #222;
            color: #ddd;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
        }
        .menu-btn:hover { background: #2a2a2a; color: #fff; }
        
        .logout-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .logout-btn:hover { background-color: #b71c1c; }

        /* Sağ Taraf (Sohbet Ekranı) */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #121212;
        }
        .chat-header {
            background: #181818;
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 18px;
            font-weight: bold;
            color: #4CAF50;
        }
        #chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.4;
            font-size: 14px;
        }
        .message.ai {
            background: #1e1e1e;
            align-self: flex-start;
            border-left: 4px solid #4CAF50;
        }
        .message.user {
            background: #2b5278;
            align-self: flex-end;
        }
        .chat-input-area {
            padding: 20px;
            background: #181818;
            display: flex;
            gap: 10px;
            border-top: 1px solid #2a2a2a;
        }
        #chat-input {
            flex: 1;
            padding: 12px;
            background: #222;
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
            font-size: 14px;
        }
        #chat-input:focus { outline: none; border-color: #4CAF50; }
        #send-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #send-btn:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-container">
        <div class="card">
            <h1>Gürai'ye Hoş Geldiniz</h1>
            <p>Devam etmek için lütfen Google hesabınızla giriş yapın.</p>
            <button id="login-btn" onclick="handleAuthClick()">Google ile Giriş Yap</button>
        </div>
    </div>

    <!-- HESAP YÖNETİMİ VE SOHBET PANELİ (Başlangıçta Gizli) -->
    <div id="app-container" style="display: none;">
        <!-- Sol Yan Menü (Hesap Bilgileri) -->
        <sidebar>
            <div>
                <div class="account-section">
                    <img id="user-avatar" src="" alt="Profil Resmi">
                    <div id="user-name">Yükleniyor...</div>
                    <div id="user-email">Yükleniyor...</div>
                </div>
                <div class="menu-links">
                    <button class="menu-btn" onclick="alert('Hesap ayarları yakında eklenecek!')">⚙️ Hesap Ayarları</button>
                    <button class="menu-btn" onclick="alert('Gürai v6.5 Aktif!')">🤖 Asistan Bilgisi</button>
                </div>
            </div>
            <button class="logout-btn" onclick="location.reload()">Oturumu Kapat</button>
        </sidebar>

        <!-- Sağ Taraf (Sohbet Ekranı) -->
        <div class="chat-main">
            <div class="chat-header">Gürai Yapay Zeka Asistanı</div>
            
            <div id="chat-messages">
                <div class="message ai">Merhaba! Hesabın başarıyla doğrulandı. Ben Gürai, sana nasıl yardımcı olabilirim?</div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Mesajınızı yazın..." onkeypress="checkEnter(event)">
                <button id="send-btn" onclick="sendMessage()">Gönder</button>
            </div>
        </div>
    </div>

    <script>
        let client;

        window.onload = function () {
            client = google.accounts.oauth2.initTokenClient({
                client_id: '508069214780-j2btpn15rhmn7nmhcfui74bcfn8l187l.apps.googleusercontent.com',
                scope: 'https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',
                callback: (response) => {
                    if (response.access_token) {
                        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                            headers: { 'Authorization': `Bearer ${response.access_token}` }
                        })
                        .then(res => res.json())
                        .then(data => {
                            // Giriş ekranını gizle, hesap yönetim panelini aç
                            document.getElementById('login-container').style.display = 'none';
                            document.getElementById('app-container').style.display = 'flex';
                            
                            // Kullanıcı verilerini yerleştir
                            document.getElementById('user-name').innerText = data.name;
                            document.getElementById('user-email').innerText = data.email;
                            if (data.picture) {
                                document.getElementById('user-avatar').src = data.picture;
                            }
                        });
                    }
                },
            });
        };

        function handleAuthClick() {
            if (client) {
                client.requestAccessToken();
            } else {
                alert("Google servisleri yükleniyor, lütfen bekleyin.");
            }
        }

        function sendMessage() {
            const inputField = document.getElementById('chat-input');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            const messagesDiv = document.getElementById('chat-messages');

            // Kullanıcı mesajı
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = messageText;
            messagesDiv.appendChild(userMsg);

            inputField.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // Yapay zeka yanıt simülasyonu
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.innerText = "Gürai sunucuları isteğinizi işledi: " + messageText;
                messagesDiv.appendChild(aiMsg);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }, 1000);
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
